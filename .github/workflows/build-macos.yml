name: Build macOS App (Intel x86_64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    # 使用Intel架构的runner (macos-13 is x86_64, macos-latest is ARM64)
    runs-on: macos-13
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python (Intel x86_64)
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        architecture: 'x64'
        
    - name: Check system architecture
      run: |
        echo "=== System Info ==="
        uname -m
        sw_vers
        echo ""
        echo "=== Python Info ==="
        python3 --version
        file $(which python3)
        python3 -c "import struct; print(f'Python struct size: {struct.calcsize(\"P\") * 8} bits')"
        
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller==6.4.0
        # Verify x86_64 architecture
        python3 -c "import platform; assert platform.machine() == 'x86_64', f'Wrong arch: {platform.machine()}'"
        echo "✓ Confirmed Intel x86_64 architecture"
        
    - name: Build macOS app (Intel x86_64)
      run: |
        # Clean previous builds
        rm -rf build dist *.spec
        
        # Build with PyInstaller
        python3 -m PyInstaller \
          --onefile \
          --windowed \
          --name "柏慧学堂" \
          --osx-bundle-identifier com.baihuixuetang.app \
          --clean \
          --noconfirm \
          run_app.py
        
        # Verify output architecture
        echo "=== Output Verification ==="
        ls -lh dist/
        file dist/柏慧学堂
        lipo -info dist/柏慧学堂 2>/dev/null || echo "Single architecture binary"
        
        # Ensure it's x86_64
        if file dist/柏慧学堂 | grep -q "x86_64"; then
          echo "✓ Confirmed Intel x86_64 binary"
        else
          echo "⚠️ Architecture check needed"
          file dist/柏慧学堂
        fi
        
    - name: Test application
      run: |
        # Test that app can be executed
        if [ -f "dist/柏慧学堂" ]; then
          echo "✓ Application built successfully"
          echo "Size: $(ls -lh dist/柏慧学堂 | awk '{print $5}')"
          ./dist/柏慧学堂 --help 2>/dev/null || echo "App built (may exit with no args)"
        else
          echo "❌ Build failed"
          exit 1
        fi
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: 柏慧学堂-macOS-Intel-x86_64
        path: dist/柏慧学堂
        retention-days: 30
