name: Build macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller
        brew install ffmpeg
        
    - name: Build universal macOS app
      run: |
        # 构建Universal Binary（同时支持Intel和Apple Silicon）
        pyinstaller --onefile \
          --windowed \
          --name "柏慧学堂" \
          --osx-bundle-identifier com.baihuixuetang.app \
          run_app.py
        
        # 验证架构支持
        file dist/柏慧学堂
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: 柏慧学堂-macOS-universal
        path: dist/柏慧学堂
